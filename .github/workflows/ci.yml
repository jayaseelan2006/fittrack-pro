
name: FitTrack Pro CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python Syntax
        run: |
          cd backend
          python -m compileall -q .

      - name: Run Backend Tests
        run: |
          cd backend
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests folder found"
          fi

  docker-build:
     name: Docker build
     runs-on: ubuntu-latest
     needs:
       - frontend-CI
       - backend-CI
     
      
     steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name: setup docker
          uses: docker/setup-buildx-action@v2

        - name: docker image
          working-directory: ./fittrack-pro  

          run:
            docker compose build



    